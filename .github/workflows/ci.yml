name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: parse all sources
        run: |
          chmod +x tests/test_parse_all.sh
          bash tests/test_parse_all.sh
      - name: rf_utils self-test (syntax-only; package install skipped)
        run: |
          export RF_PROJECT_ROOT="$GITHUB_WORKSPACE"
          Rscript -e "parse('R/rf_utils.R'); cat('rf_utils parses\n')"
